name: Build & Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone garrysmod_common
        run: |
          git clone --branch x86-64-support-sourcesdk --recurse-submodules --depth 1 `
            https://github.com/danielga/garrysmod_common.git module/garrysmod_common

      - name: Download premake
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip" `
            -OutFile premake.zip
          Expand-Archive -Path premake.zip -DestinationPath premake -Force

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        working-directory: module
        run: ..\premake\premake5.exe --gmcommon=garrysmod_common vs2022

      - name: Build
        run: |
          $sln = Get-ChildItem -Path module/projects -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) { throw "No solution file found" }
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /m

      - name: Collect binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dlls = Get-ChildItem -Path module -Recurse -Include gmsv_gprofiler_win64.dll,gmcl_gprofiler_win64.dll
          if ($dlls.Count -eq 0) { throw "No built DLLs found" }
          $dlls | ForEach-Object { Copy-Item $_.FullName -Destination dist }
          Get-ChildItem dist

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: gprofiler-windows
          path: dist/*.dll

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone garrysmod_common
        run: |
          git clone --branch x86-64-support-sourcesdk --recurse-submodules --depth 1 \
            https://github.com/danielga/garrysmod_common.git module/garrysmod_common

      - name: Download premake
        run: |
          curl -L \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            -o premake.tar.gz
          mkdir premake
          tar -xzf premake.tar.gz -C premake
          chmod +x premake/premake5

      - name: Generate project files
        working-directory: module
        run: ../premake/premake5 --gmcommon=garrysmod_common gmake

      - name: Build
        run: make -C module/projects/linux/gmake config=release_x86_64 -j"$(nproc)"

      - name: Collect binaries
        run: |
          mkdir -p dist
          find module -type f \( -name gmsv_gprofiler_linux64.dll -o -name gmcl_gprofiler_linux64.dll \) -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*_linux64.dll' -print -quit)"
          ls -l dist

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: gprofiler-linux64
          path: dist/*_linux64.dll

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: gprofiler-*
          path: dist
          merge-multiple: true

      - name: Package addon
        run: zip -r "dist/GProfiler-${{ inputs.version }}.zip" lua materials resource

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: |
            dist/*
